<!DOCTYPE html>
<html lang="en" data-skin="noir" data-lite="off">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src 'self' https: blob: data:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages — Arcade Campus Hub</title>
  <meta name="description" content="Direct messages with your friends.">
  <meta name="theme-color" content="#0c0d10">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/core/access-gate.js"></script>
  <script src="js/core/theme-boot.js"></script>
  <script src="js/core/consent-gate.js"></script>
</head>
<body class="social-page messages-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-shell="chrome"></div>

  <main class="main" id="main">

    <h1 class="sr-only">Messages</h1>

    <div class="msgs" id="msgs">
      <aside class="msgs-side" aria-label="Conversations">
        <div class="msgs-side-head">
          <h2>Chats</h2>
          <button type="button" class="btn btn-cta btn-sm msgs-new" id="new-chat">New chat</button>
        </div>
        <label class="chat-search msgs-search" id="search-wrap">
          <input id="thread-search" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations">
        </label>
        <div class="msgs-status" id="thread-status" role="status" hidden>
          <span id="thread-status-text"></span>
          <button type="button" id="thread-retry" class="btn btn-sm">Try again</button>
        </div>
        <div class="chat-rows msgs-rows" id="thread-list"></div>
      </aside>

      <section class="msgs-main" id="panel" aria-label="Conversation">
        <div class="msgs-welcome" id="dm-empty">
          <span class="chat-empty-art" id="welcome-art"></span>
          <strong>Your messages</strong>
          <p>Pick a conversation, or start a new one with a friend.</p>
          <button type="button" class="btn btn-cta" id="welcome-new">Start a chat</button>
        </div>

        <div class="msgs-open" id="dm-open" hidden>
          <header class="msgs-head" id="dm-head"></header>
          <div class="msgs-body">
            <div class="msgs-convo" id="convo-host"></div>
            <aside class="msgs-info" id="info" hidden aria-label="Conversation details"></aside>
          </div>
        </div>
      </section>
    </div>

    <div data-shell="foot"></div>
  </main>

  <script src="js/core/config.js"></script>
  <script src="data/games.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/features/catalog-overlay.js"></script>
  <script src="js/features/catalog.js"></script>
  <script src="js/features/art.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/api-supabase.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/realtime.js"></script>
  <script src="js/features/social-ui.js"></script>
  <script src="js/features/capture.js"></script>
  <script src="js/features/chat-core.js"></script>
  <script src="js/features/chat-dock.js"></script>
  <script src="js/features/call.js"></script>
  <script src="js/features/game-saves.js"></script>
  <script src="js/features/shell.js"></script>
  <script src="js/features/motion-fx.js"></script>
  <script src="js/features/context-menu.js"></script>
  <script src="js/pages/page-messages.js"></script>
</body>
</html>
