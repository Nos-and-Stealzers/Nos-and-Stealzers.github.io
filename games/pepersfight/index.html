<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pepersfight — Birds vs Peppers Seed Royale</title>
<style>
  html, body { margin: 0; height: 100%; background: #14102a; overflow: hidden; font-family: system-ui, "Segoe UI", sans-serif; }
  #unity-canvas { width: 100%; height: 100%; display: block; background: #14102a; outline: none; }
  #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; background: radial-gradient(900px 500px at 50% 0%, #3b2a8c, #14102a 70%); }
  #loader h1 { margin: 0; font-size: 44px; letter-spacing: 1px; font-weight: 800; }
  #loader h1 span { color: #ffd23f; }
  #loader p { margin: 0; opacity: .7; font-size: 14px; }
  #bar { width: min(420px, 80vw); height: 12px; border-radius: 6px; background: rgba(255,255,255,.12); overflow: hidden; }
  #fill { height: 100%; width: 0; background: linear-gradient(90deg, #ff7a59, #ffd23f); transition: width .2s; }
  #err { color: #ff8a80; max-width: 520px; text-align: center; font-size: 14px; display: none; }
  #network-panel { position: fixed; left: 10px; top: 10px; z-index: 4; max-width: min(420px, calc(100vw - 44px)); color: #eee9ff; font-size: 13px; background: #19152deb; border: 1px solid #514663; border-radius: 12px; padding: 10px 12px; }
  #network-panel summary { cursor: pointer; color: #ffd23f; }
  #network-panel[open] summary { margin-bottom: 12px; }
  #network-panel p { line-height: 1.5; }
  .network-note { color: #b8b0cc; }
  .network-actions { display:flex; gap:8px; flex-wrap:wrap; }
  .network-actions button { color: #fff; background: #3b3157; border: 1px solid #77648f; border-radius: 6px; padding: 8px; cursor:pointer; }
  .network-actions button:focus-visible, summary:focus-visible { outline: 2px solid #ffd23f; outline-offset: 3px; }
  [data-state="ok"] { color: #9cecac; } [data-state="error"] { color: #ffb0a7; }
  #remote-probe { max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
  #loader { z-index:5; }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <h1>PEPERS <span>FIGHT</span></h1>
  <div id="bar"><div id="fill"></div></div>
  <p id="status">Loading the island…</p>
  <div id="err"></div>
</div>
<script src="network-ui.js?v=2.0.2"></script>
<script>
  var canvas = document.getElementById("unity-canvas");
  var fill = document.getElementById("fill");
  var config = {
    dataUrl: "Build/WebGL.data.unityweb?v=2.0.2",
    frameworkUrl: "Build/WebGL.framework.js.unityweb?v=2.0.2",
    codeUrl: "Build/WebGL.wasm.unityweb?v=2.0.2",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Pepers",
    productName: "Pepersfight",
    productVersion: "1.0",
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
  };
  var s = document.createElement("script");
  s.src = "Build/WebGL.loader.js?v=2.0.2";
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) { fill.style.width = Math.round(p * 100) + "%"; })
      .then(function (inst) { window.unityInstance = inst; document.getElementById("loader").style.display = "none"; canvas.focus(); })
      .catch(function (e) { var el = document.getElementById("err"); el.style.display = "block"; el.textContent = "Couldn't start the game: " + e; });
  };
  document.body.appendChild(s);
  canvas.addEventListener("click", function () { canvas.focus(); });
</script>
</body>
</html>
