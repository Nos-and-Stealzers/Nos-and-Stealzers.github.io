<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Road Crosser</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:12px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(440px,94vw);align-items:baseline;}
  h1{font-size:26px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:15px;color:#8a8f99;}
  .sc b{color:#4dd9ff;}
  canvas{width:min(440px,94vw);aspect-ratio:1;background:#16181d;border:1px solid #35373f;
    border-radius:8px;touch-action:none;}
  .msg{min-height:18px;font-weight:700;text-align:center;}
  .msg.over{color:#ff5c66;}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(240px,72vw);}
  .pad button{background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:14px 0;
    font:inherit;cursor:pointer;border-radius:6px;font-size:18px;}
  .pad button:hover{border-color:#4dd9ff;color:#4dd9ff;}
  .pad .sp{visibility:hidden;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;max-width:440px;}
</style>
</head>
<body>
  <div class="top"><h1>Road Crosser</h1><div class="sc">score <b id="score">0</b> &middot; best <b id="best">0</b></div></div>
  <canvas id="c" width="440" height="440"></canvas>
  <div class="msg" id="msg">Reach the top. Arrow keys or the pad.</div>
  <div class="pad">
    <button class="sp"></button><button data-d="up">&#9650;</button><button class="sp"></button>
    <button data-d="left">&#9664;</button><button data-d="down">&#9660;</button><button data-d="right">&#9654;</button>
  </div>
  <div class="hint">Cross the traffic to the green strip at the top for a point. Getting hit ends the run. Every point speeds things up.</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var msg=document.getElementById("msg"),scoreEl=document.getElementById("score"),bestEl=document.getElementById("best");
  var COLS=11,ROWS=11,cell=440/COLS;
  var best=parseInt(localStorage.getItem("oroad.best")||"0",10);bestEl.textContent=best;
  var px,py,score,lanes,over,raf,speed;
  var CARCOL=["#ff5c66","#f2b705","#4dd9ff","#b06cff","#ff8a3d"];
  function reset(){
    px=(COLS/2)|0;py=ROWS-1;score=0;over=false;speed=1;
    lanes=[];
    for(var r=1;r<ROWS-1;r++){
      var dir=r%2===0?1:-1,sp=(0.6+Math.random()*0.7);
      var cars=[];var n=2+((Math.random()*2)|0);
      for(var k=0;k<n;k++)cars.push(Math.random()*COLS);
      lanes.push({row:r,dir:dir,speed:sp,cars:cars,col:CARCOL[(r-1)%CARCOL.length],w:1.1});
    }
    scoreEl.textContent=0;msg.textContent="Reach the top. Arrow keys or the pad.";msg.className="msg";
    if(raf)cancelAnimationFrame(raf);loop();
  }
  function move(dx,dy){
    if(over)return;
    var nx=px+dx,ny=py+dy;
    if(nx<0||nx>=COLS||ny<0||ny>=ROWS)return;
    px=nx;py=ny;
    if(py===0){score++;scoreEl.textContent=score;speed=1+score*0.08;py=ROWS-1;
      if(score>best){best=score;localStorage.setItem("oroad.best",String(best));bestEl.textContent=best;}}
  }
  function loop(){
    // advance cars
    lanes.forEach(function(l){
      for(var i=0;i<l.cars.length;i++){
        l.cars[i]+=l.dir*l.speed*speed*0.04;
        if(l.cars[i]>COLS+1)l.cars[i]=-1;
        if(l.cars[i]<-1)l.cars[i]=COLS+1;
      }
    });
    // collision
    lanes.forEach(function(l){
      if(l.row!==py)return;
      l.cars.forEach(function(cx){
        if(px+0.5>cx&&px+0.5<cx+l.w)die();
      });
    });
    draw();
    if(!over)raf=requestAnimationFrame(loop);
  }
  function die(){
    over=true;msg.textContent="Splat! Final score "+score+".";msg.className="msg over";
  }
  function draw(){
    ctx.clearRect(0,0,440,440);
    // rows
    for(var r=0;r<ROWS;r++){
      if(r===0)ctx.fillStyle="#123a1e";
      else if(r===ROWS-1)ctx.fillStyle="#123a1e";
      else ctx.fillStyle=r%2===0?"#1c1e24":"#202229";
      ctx.fillRect(0,r*cell,440,cell);
      if(r>0&&r<ROWS-1){ctx.strokeStyle="rgba(255,255,255,.08)";ctx.setLineDash([8,10]);
        ctx.beginPath();ctx.moveTo(0,r*cell+cell/2);ctx.lineTo(440,r*cell+cell/2);ctx.stroke();ctx.setLineDash([]);}
    }
    // cars
    lanes.forEach(function(l){
      ctx.fillStyle=l.col;
      l.cars.forEach(function(cx){
        var x=cx*cell,y=l.row*cell+cell*0.18,w=l.w*cell*0.9,h=cell*0.64;
        rr(x,y,w,h,6);ctx.fill();
      });
    });
    // player
    ctx.fillStyle="#3fb950";
    rr(px*cell+cell*0.16,py*cell+cell*0.16,cell*0.68,cell*0.68,7);ctx.fill();
    ctx.fillStyle="#04210f";ctx.font=(cell*0.4)+"px monospace";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("\u25CF",px*cell+cell/2,py*cell+cell/2);
  }
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  addEventListener("keydown",function(e){
    var k=e.key;
    if(k==="ArrowUp"){move(0,-1);e.preventDefault();}
    else if(k==="ArrowDown"){move(0,1);e.preventDefault();}
    else if(k==="ArrowLeft"){move(-1,0);e.preventDefault();}
    else if(k==="ArrowRight"){move(1,0);e.preventDefault();}
    else if((k===" "||k==="Enter")&&over)reset();
  });
  document.querySelectorAll(".pad button[data-d]").forEach(function(b){
    b.addEventListener("click",function(){
      if(over){reset();return;}
      var d=this.dataset.d;
      if(d==="up")move(0,-1);else if(d==="down")move(0,1);
      else if(d==="left")move(-1,0);else move(1,0);
    });
  });
  cv.addEventListener("click",function(){if(over)reset();});
  reset();
})();
</script>
</body>
</html>
