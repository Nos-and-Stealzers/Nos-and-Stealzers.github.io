<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Hangman</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:14px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(520px,94vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:14px;color:#8a8f99;}
  .sc b{color:#f2b705;}
  .lives{font-size:22px;letter-spacing:4px;min-height:1em;}
  .word{font-size:clamp(26px,8vw,44px);font-weight:800;letter-spacing:6px;min-height:1.2em;text-align:center;}
  .cat{font-size:12px;color:#8a8f99;text-transform:uppercase;letter-spacing:.1em;}
  .keys{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;width:min(520px,94vw);}
  .k{padding:10px 0;background:#25272e;border:1px solid #35373f;font:inherit;font-weight:700;
    cursor:pointer;color:#e8eaed;text-transform:uppercase;transition:background .1s,border-color .1s;}
  .k:hover:not(:disabled){border-color:#f2b705;}
  .k:disabled{cursor:default;opacity:.4;}
  .k.hit{background:#123a1e;border-color:#3fb950;color:#3fb950;opacity:1;}
  .k.miss{background:#3a1216;border-color:#e5484d;color:#e5484d;opacity:1;}
  .row{display:flex;gap:8px;width:min(520px,94vw);}
  button.act{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button.act:hover{border-color:#f2b705;color:#f2b705;}
  .msg{min-height:16px;text-align:center;font-weight:700;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;}
</style>
</head>
<body>
  <div class="top"><h1>Hangman</h1><div class="sc">wins <b id="w">0</b> &middot; streak <b id="st">0</b> &middot; best <b id="b">0</b></div></div>
  <div class="cat" id="cat"></div>
  <div class="lives" id="lives"></div>
  <div class="word" id="word"></div>
  <div class="keys" id="keys"></div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="act" id="new">New word</button></div>
  <div class="hint">Guess letters before you run out of lives. Type on your keyboard or tap. Six misses and it's over.</div>
<script>
(function(){
  "use strict";
  var WORDS=[
    ["animals","ELEPHANT","GIRAFFE","DOLPHIN","PENGUIN","KANGAROO","OCTOPUS","CHEETAH","HEDGEHOG","FLAMINGO","RACCOON"],
    ["countries","BRAZIL","CANADA","JAPAN","FRANCE","EGYPT","NORWAY","MEXICO","THAILAND","MOROCCO","PORTUGAL"],
    ["food","PANCAKE","BURRITO","NOODLES","AVOCADO","PRETZEL","LASAGNA","CUPCAKE","POPCORN","SPINACH","OMELETTE"],
    ["space","GALAXY","NEBULA","COMET","ASTEROID","SATURN","ECLIPSE","METEOR","ORBIT","COSMOS","GRAVITY"],
    ["gaming","JOYSTICK","AVATAR","RESPAWN","POWERUP","CHECKPOINT","SPEEDRUN","INVENTORY","LEVELUP","MULTIPLAYER","ARCADE"]
  ];
  var wins=+(localStorage.getItem("ohang.wins")||0),best=+(localStorage.getItem("ohang.best")||0),streak=0;
  document.getElementById("w").textContent=wins;document.getElementById("b").textContent=best;
  var word,cat,guessed,lives,over;
  var keys=document.getElementById("keys");

  function pick(){
    var group=WORDS[(Math.random()*WORDS.length)|0];
    cat=group[0];word=group[1+((Math.random()*(group.length-1))|0)];
    guessed={};lives=6;over=false;
    document.getElementById("cat").textContent=cat;
    document.getElementById("msg").textContent="";
    buildKeys();render();
  }
  function buildKeys(){
    keys.innerHTML="";
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(function(ch){
      var b=document.createElement("button");b.className="k";b.textContent=ch;b.dataset.ch=ch;
      b.addEventListener("click",function(){guess(ch);});keys.appendChild(b);
    });
  }
  function render(){
    document.getElementById("lives").textContent=
      "\u2665 ".repeat(lives).trim()+" "+"\u00b7 ".repeat(6-lives).trim();
    document.getElementById("word").textContent=
      word.split("").map(function(c){return guessed[c]?c:"_";}).join(" ");
  }
  function guess(ch){
    if(over||guessed[ch])return;guessed[ch]=true;
    var btn=keys.querySelector('[data-ch="'+ch+'"]');if(btn)btn.disabled=true;
    if(word.indexOf(ch)>=0){if(btn)btn.classList.add("hit");
      if(word.split("").every(function(c){return guessed[c];}))finish(true);}
    else{if(btn)btn.classList.add("miss");lives--;if(lives<=0)finish(false);}
    render();
  }
  function finish(won){
    over=true;
    if(won){wins++;streak++;localStorage.setItem("ohang.wins",wins);
      document.getElementById("w").textContent=wins;
      if(streak>best){best=streak;localStorage.setItem("ohang.best",best);document.getElementById("b").textContent=best;}
      document.getElementById("msg").style.color="#3fb950";
      document.getElementById("msg").textContent="Solved it! \u2014 "+word;}
    else{streak=0;document.getElementById("msg").style.color="#e5484d";
      document.getElementById("msg").textContent="Out of lives \u2014 it was "+word;
      document.getElementById("word").textContent=word.split("").join(" ");}
    document.getElementById("st").textContent=streak;
  }
  document.addEventListener("keydown",function(e){
    var ch=e.key.toUpperCase();
    if(ch.length===1&&ch>="A"&&ch<="Z")guess(ch);
    else if(e.key==="Enter"&&over)pick();
  });
  document.getElementById("new").addEventListener("click",pick);
  pick();
})();
</script>
</body>
</html>
