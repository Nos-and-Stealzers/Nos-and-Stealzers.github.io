<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Flood It</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:12px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(420px,92vw);align-items:baseline;}
  h1{font-size:26px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:15px;color:#8a8f99;}
  .sc b{color:#4dd9ff;}
  .board{display:grid;gap:2px;width:min(420px,92vw);aspect-ratio:1;}
  .cell{border-radius:2px;transition:background .18s;}
  .msg{min-height:18px;font-weight:700;}
  .msg.win{color:#3fb950;} .msg.lose{color:#ff5c66;}
  .picker{display:flex;gap:8px;width:min(420px,92vw);flex-wrap:wrap;justify-content:center;}
  .pick{width:44px;height:44px;border:2px solid #2a2c33;border-radius:6px;cursor:pointer;transition:transform .08s;}
  .pick:active{transform:scale(.9);}
  .row{display:flex;gap:8px;width:min(420px,92vw);}
  button{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;border-radius:4px;}
  button:hover{border-color:#4dd9ff;color:#4dd9ff;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;max-width:420px;}
</style>
</head>
<body>
  <div class="top"><h1>Flood It</h1><div class="sc">moves <b id="moves">0</b>/<span id="limit">25</span> &middot; best <b id="best">—</b></div></div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div class="picker" id="picker"></div>
  <div class="row"><button id="new">New board</button><button id="size">Size: 14</button></div>
  <div class="hint">Flood the whole board into one colour. Each pick fills the connected region from the top-left corner.</div>
<script>
(function(){
  "use strict";
  var COLORS=["#ff5c66","#f2b705","#3fb950","#4dd9ff","#b06cff","#ff8a3d"];
  var boardEl=document.getElementById("board"),msg=document.getElementById("msg"),pickerEl=document.getElementById("picker");
  var N=14,grid,moves,limit,over;
  var best=JSON.parse(localStorage.getItem("oflood.best")||"{}");

  function limitFor(n){return Math.ceil(n*25/14);}
  function idx(r,c){return r*N+c;}

  function fresh(){
    grid=[];
    for(var i=0;i<N*N;i++)grid.push((Math.random()*COLORS.length)|0);
    moves=0;over=false;limit=limitFor(N);
    document.getElementById("moves").textContent=0;
    document.getElementById("limit").textContent=limit;
    document.getElementById("best").textContent=best[N]?best[N]+" moves":"—";
    msg.textContent="";msg.className="msg";
    render();
  }
  function render(){
    boardEl.style.gridTemplateColumns="repeat("+N+",1fr)";
    boardEl.innerHTML="";
    for(var i=0;i<N*N;i++){
      var d=document.createElement("div");d.className="cell";
      d.style.background=COLORS[grid[i]];boardEl.appendChild(d);
    }
  }
  function flood(target){
    if(over)return;
    var start=grid[0];
    if(start===target)return;
    var stack=[0],seen={};seen[0]=1;
    var region=[];
    while(stack.length){
      var p=stack.pop();region.push(p);
      var r=(p/N)|0,c=p%N;
      [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(function(n){
        var rr=n[0],cc=n[1];
        if(rr<0||cc<0||rr>=N||cc>=N)return;
        var q=idx(rr,cc);
        if(!seen[q]&&grid[q]===start){seen[q]=1;stack.push(q);}
      });
    }
    region.forEach(function(p){grid[p]=target;});
    moves++;document.getElementById("moves").textContent=moves;
    render();check();
  }
  function check(){
    var first=grid[0];
    var done=grid.every(function(v){return v===first;});
    if(done){
      over=true;msg.textContent="Solved in "+moves+" moves!";msg.className="msg win";
      if(!best[N]||moves<best[N]){best[N]=moves;localStorage.setItem("oflood.best",JSON.stringify(best));
        document.getElementById("best").textContent=moves+" moves";}
    }else if(moves>=limit){
      over=true;msg.textContent="Out of moves — try again.";msg.className="msg lose";
    }
  }
  COLORS.forEach(function(col,i){
    var b=document.createElement("div");b.className="pick";b.style.background=col;
    b.addEventListener("click",function(){flood(i);});
    pickerEl.appendChild(b);
  });
  document.getElementById("new").addEventListener("click",fresh);
  document.getElementById("size").addEventListener("click",function(){
    N=N===14?10:N===10?18:14;this.textContent="Size: "+N;fresh();});
  fresh();
})();
</script>
</body>
</html>
