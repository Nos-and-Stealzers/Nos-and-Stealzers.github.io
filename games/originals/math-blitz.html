<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Math Blitz</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:14px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(440px,92vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:14px;color:#8a8f99;}
  .sc b{color:#f2b705;}
  .q{font-size:clamp(36px,12vw,64px);font-weight:800;letter-spacing:-1px;min-height:1.1em;}
  .bar{width:min(440px,92vw);height:8px;background:#25272e;border:1px solid #35373f;overflow:hidden;}
  .bar i{display:block;height:100%;background:#3fb950;width:100%;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(440px,92vw);}
  .opt{padding:20px;background:#25272e;border:1px solid #35373f;font:inherit;font-size:22px;
    font-weight:700;cursor:pointer;color:#e8eaed;transition:transform .06s,border-color .1s,background .1s;}
  .opt:hover{border-color:#f2b705;}
  .opt:active{transform:scale(.97);}
  .opt.good{background:#123a1e;border-color:#3fb950;}
  .opt.bad{background:#3a1216;border-color:#e5484d;}
  .row{display:flex;gap:8px;width:min(440px,92vw);}
  button.act{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button.act:hover{border-color:#f2b705;color:#f2b705;}
  .msg{min-height:16px;text-align:center;font-weight:700;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;}
</style>
</head>
<body>
  <div class="top"><h1>Math Blitz</h1><div class="sc">score <b id="s">0</b> &middot; best <b id="b">0</b> &middot; streak <b id="st">0</b></div></div>
  <div class="q" id="q">Ready?</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="grid" id="opts"></div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="act" id="start">Start</button></div>
  <div class="hint">Solve as many as you can in 60 seconds. Streaks add bonus points; a miss breaks the streak.</div>
<script>
(function(){
  "use strict";
  var best=+(localStorage.getItem("omath.best")||0);
  document.getElementById("b").textContent=best;
  var score,streak,answer,playing=false,tEnd,tick;
  var opts=document.getElementById("opts");

  function make(){
    var lvl=Math.min(4,1+((score/60)|0));
    var ops=lvl>=2?["+","-","×"]:["+","-"];
    if(lvl>=3)ops.push("÷");
    var op=ops[(Math.random()*ops.length)|0],a,b;
    if(op==="+"){a=rnd(5+lvl*8);b=rnd(5+lvl*8);answer=a+b;}
    else if(op==="-"){a=rnd(9+lvl*9);b=rnd(a);answer=a-b;}
    else if(op==="×"){a=rnd(3+lvl*3)+1;b=rnd(3+lvl*3)+1;answer=a*b;}
    else{b=rnd(8)+2;answer=rnd(9)+1;a=b*answer;}
    document.getElementById("q").textContent=a+" "+op+" "+b+" =";
    var set=[answer];
    while(set.length<4){var d=answer+(rnd(11)-5)+(rnd(2)?rnd(4):0);
      if(d!==answer&&d>=0&&set.indexOf(d)<0)set.push(d);}
    for(var k=set.length-1;k>0;k--){var r=rnd(k+1);var t=set[k];set[k]=set[r];set[r]=t;}
    opts.innerHTML="";
    set.forEach(function(v){var btn=document.createElement("button");btn.className="opt";
      btn.textContent=v;btn.addEventListener("click",function(){guess(v,btn);});opts.appendChild(btn);});
  }
  function rnd(n){return (Math.random()*n)|0;}
  function guess(v,btn){
    if(!playing)return;
    if(v===answer){streak++;var bonus=Math.min(5,1+((streak-1)/3|0));score+=bonus;
      btn.classList.add("good");
      document.getElementById("s").textContent=score;document.getElementById("st").textContent=streak;
      setTimeout(make,120);}
    else{streak=0;document.getElementById("st").textContent=0;btn.classList.add("bad");
      setTimeout(make,300);}
  }
  function endGame(){
    playing=false;clearInterval(tick);
    document.getElementById("q").textContent="Time!";opts.innerHTML="";
    document.getElementById("msg").textContent="Final score "+score;
    if(score>best){best=score;localStorage.setItem("omath.best",best);document.getElementById("b").textContent=best;}
    document.getElementById("start").textContent="Play again";
  }
  document.getElementById("start").addEventListener("click",function(){
    score=0;streak=0;playing=true;
    document.getElementById("s").textContent=0;document.getElementById("st").textContent=0;
    document.getElementById("msg").textContent="";this.textContent="Start";
    tEnd=Date.now()+60000;
    clearInterval(tick);tick=setInterval(function(){
      var left=tEnd-Date.now();document.getElementById("bar").style.width=Math.max(0,left/60000*100)+"%";
      if(left<=0)endGame();
    },50);
    make();
  });
  // number keys 1-4 pick options
  document.addEventListener("keydown",function(e){
    var i=["1","2","3","4"].indexOf(e.key);
    if(i>=0&&opts.children[i])opts.children[i].click();
  });
})();
</script>
</body>
</html>
