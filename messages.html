<!DOCTYPE html>
<html lang="en" data-skin="noir" data-lite="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages — Arcade Campus Hub</title>
  <meta name="description" content="Direct messages with your friends.">
  <meta name="theme-color" content="#0c0d10">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/social-refresh.css">
  <script src="js/core/access-gate.js"></script>
  <script src="js/core/theme-boot.js"></script>
  <script src="js/core/consent-gate.js"></script>
</head>
<body class="social-page messages-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <div data-shell="chrome"></div>

  <main class="main" id="main">

    <header class="page-head" style="padding-bottom:1rem;margin-bottom:1.2rem">
      <span class="label">Social</span>
      <h1>Messages</h1>
      <p class="social-intro">Make a plan. Share a moment. Keep playing.</p>
    </header>

    <div class="dm" id="dm">
      <aside class="dm-sidebar" aria-label="Conversations">
        <div class="dm-sidebar-head"><h2>Conversations</h2><label class="sr-only" for="thread-search">Search conversations</label><input id="thread-search" type="search" placeholder="Search conversations" autocomplete="off"></div>
        <p id="thread-status" class="social-status" role="status">Loading conversations…</p>
        <button type="button" id="thread-retry" class="btn btn-sm" hidden>Retry</button>
        <div class="dm-list" id="thread-list"></div>
      </aside>

      <section class="dm-panel" id="panel">
        <div class="dm-empty" id="dm-empty">
          <strong>Pick a conversation</strong>
          <p class="dim tiny">Or start one from <a href="friends.html">Friends</a>.</p>
        </div>

        <div class="dm-open" id="dm-open" hidden>
          <button type="button" id="dm-back" class="btn btn-flat dm-back">← Conversations</button>
          <header class="dm-head" id="dm-head"></header>
          <p id="conversation-status" class="social-status" role="status"></p>
          <div class="dm-log" id="log" role="log" aria-label="Messages" tabindex="0" aria-live="polite" aria-relevant="additions"></div>
          <form class="dm-compose" id="compose">
            <label for="body" class="sr-only">Message</label>
            <textarea id="body" rows="1" maxlength="2000" placeholder="Write a message…"></textarea>
            <button class="btn btn-cta" type="submit" id="send">Send</button>
          </form>
          <p class="dm-locked" id="locked" hidden></p>
        </div>
      </section>
    </div>

    <div data-shell="foot"></div>
  </main>

  <script src="js/core/config.js"></script>
  <script src="data/games.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/features/catalog-overlay.js"></script>
  <script src="js/features/catalog.js"></script>
  <script src="js/features/art.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/api-supabase.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/features/social-ui.js"></script>
  <script src="js/features/capture.js"></script>
  <script src="js/features/chat-dock.js"></script>
  <script src="js/features/call.js"></script>
  <script src="js/features/game-saves.js"></script>
  <script src="js/features/shell.js"></script>
  <script src="js/features/motion-fx.js"></script>
  <script src="js/features/context-menu.js"></script>
  <script src="js/pages/page-messages.js"></script>
</body>
</html>
