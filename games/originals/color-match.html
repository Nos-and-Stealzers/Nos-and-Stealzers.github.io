<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Color Match</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:14px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(460px,92vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:14px;color:#8a8f99;}
  .sc b{color:#f2b705;}
  .prompt{font-size:clamp(34px,11vw,58px);font-weight:800;letter-spacing:-1px;min-height:1.1em;}
  .bar{width:min(460px,92vw);height:8px;background:#25272e;border:1px solid #35373f;overflow:hidden;}
  .bar i{display:block;height:100%;background:#3fb950;width:100%;transition:width .1s linear;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:min(460px,92vw);}
  .opt{padding:18px;background:#25272e;border:1px solid #35373f;font:inherit;font-size:16px;
    font-weight:700;cursor:pointer;color:#e8eaed;transition:transform .06s,border-color .1s;}
  .opt:hover{border-color:#f2b705;}
  .opt:active{transform:scale(.97);}
  .row{display:flex;gap:8px;width:min(460px,92vw);}
  button.act{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button.act:hover{border-color:#f2b705;color:#f2b705;}
  .msg{min-height:16px;text-align:center;font-weight:700;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;max-width:460px;}
</style>
</head>
<body>
  <div class="top"><h1>Color Match</h1><div class="sc">score <b id="s">0</b> &middot; best <b id="b">0</b></div></div>
  <div class="prompt" id="prompt">Ready?</div>
  <div class="bar"><i id="bar"></i></div>
  <div class="grid" id="opts"></div>
  <div class="msg" id="msg"></div>
  <div class="row"><button class="act" id="start">Start</button></div>
  <div class="hint">Pick the button whose <b>text colour</b> matches the word — not what it says. Beat the clock, it speeds up.</div>
<script>
(function(){
  "use strict";
  var NAMES=["RED","GREEN","BLUE","YELLOW","PURPLE","ORANGE","CYAN","PINK"];
  var HEX={RED:"#e5484d",GREEN:"#3fb950",BLUE:"#4f8cff",YELLOW:"#f2b705",
    PURPLE:"#b06cff",ORANGE:"#ff8a3d",CYAN:"#4dd9ff",PINK:"#ff6ab5"};
  var best=+(localStorage.getItem("ocolor.best")||0);
  document.getElementById("b").textContent=best;
  var score,answer,timeLeft,limit,timer,playing=false;
  var opts=document.getElementById("opts");

  function round(){
    var word=NAMES[(Math.random()*NAMES.length)|0];
    answer=NAMES[(Math.random()*NAMES.length)|0]; // the display colour is the answer
    var p=document.getElementById("prompt");
    p.textContent=word;p.style.color=HEX[answer];
    var choices=[answer];
    while(choices.length<4){var c=NAMES[(Math.random()*NAMES.length)|0];if(choices.indexOf(c)<0)choices.push(c);}
    for(var k=choices.length-1;k>0;k--){var r=(Math.random()*(k+1))|0;var t=choices[k];choices[k]=choices[r];choices[r]=t;}
    opts.innerHTML="";
    choices.forEach(function(c){
      var b=document.createElement("button");b.className="opt";b.textContent=c;
      b.addEventListener("click",function(){guess(c);});opts.appendChild(b);
    });
    limit=Math.max(700,2100-score*40);timeLeft=limit;
    clearInterval(timer);var start=Date.now();
    timer=setInterval(function(){
      timeLeft=limit-(Date.now()-start);
      document.getElementById("bar").style.width=Math.max(0,timeLeft/limit*100)+"%";
      if(timeLeft<=0){clearInterval(timer);lose("Too slow!");}
    },30);
  }
  function guess(c){
    if(!playing)return;
    if(c===answer){score++;document.getElementById("s").textContent=score;
      document.getElementById("msg").textContent="";round();}
    else lose("Wrong colour!");
  }
  function lose(why){
    playing=false;clearInterval(timer);
    document.getElementById("msg").style.color="#e5484d";
    document.getElementById("msg").textContent=why+" Final score "+score;
    if(score>best){best=score;localStorage.setItem("ocolor.best",best);document.getElementById("b").textContent=best;}
    document.getElementById("start").textContent="Play again";
  }
  document.getElementById("start").addEventListener("click",function(){
    score=0;playing=true;document.getElementById("s").textContent=0;
    document.getElementById("msg").textContent="";this.textContent="Start";round();
  });
})();
</script>
</body>
</html>
