<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tower Stack</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:10px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(360px,92vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:15px;color:#8a8f99;}
  .sc b{color:#ff8a3d;}
  canvas{background:#101318;border:1px solid #2a2c33;border-radius:6px;touch-action:none;display:block;}
  .msg{min-height:16px;font-weight:700;color:#ff5c66;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;max-width:360px;}
</style>
</head>
<body>
  <div class="top"><h1>Tower Stack</h1><div class="sc">height <b id="score">0</b> &middot; best <b id="best">0</b></div></div>
  <canvas id="c" width="320" height="480"></canvas>
  <div class="msg" id="msg"></div>
  <div class="hint">Tap / click / Space to drop the sliding block. Overhang gets sliced off — keep it centred and build high.</div>
<script>
(function(){
  "use strict";
  var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
  var msg=document.getElementById("msg");
  var best=+(localStorage.getItem("otower.best")||0);
  document.getElementById("best").textContent=best;
  var BH=26; // block height
  var stack,cur,speed,dir,score,over,camY,raf;

  function reset(){
    var base={x:W/2-70,w:140,y:H-BH,hue:200};
    stack=[base];
    score=0;over=false;camY=0;speed=2.2;dir=1;
    document.getElementById("score").textContent=0;
    msg.textContent="";
    spawn();
    cancelAnimationFrame(raf);loop();
  }
  function spawn(){
    var top=stack[stack.length-1];
    cur={x:0,w:top.w,y:top.y-BH,hue:(200+stack.length*24)%360};
    dir=Math.random()<0.5?1:-1;
    cur.x=dir>0?0:W-cur.w;
  }
  function drop(){
    if(over){reset();return;}
    var top=stack[stack.length-1];
    var left=Math.max(cur.x,top.x),right=Math.min(cur.x+cur.w,top.x+top.w);
    var overlap=right-left;
    if(overlap<=0){gameOver();return;}
    cur.x=left;cur.w=overlap;
    stack.push({x:cur.x,w:cur.w,y:cur.y,hue:cur.hue});
    score++;document.getElementById("score").textContent=score;
    speed=Math.min(6.5,2.2+score*0.12);
    // scroll camera up as tower grows past mid-screen
    if(cur.y-camY<H*0.35)camY=cur.y-H*0.35;
    spawn();
  }
  function gameOver(){
    over=true;msg.textContent="Toppled at height "+score+" — tap to retry.";
    if(score>best){best=score;localStorage.setItem("otower.best",best);
      document.getElementById("best").textContent=best;}
  }
  function loop(){
    if(!over){
      cur.x+=speed*dir;
      if(cur.x<=0){cur.x=0;dir=1;}
      if(cur.x+cur.w>=W){cur.x=W-cur.w;dir=-1;}
    }
    draw();
    raf=requestAnimationFrame(loop);
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<stack.length;i++){var b=stack[i];block(b,i);}
    if(!over)block(cur,stack.length);
  }
  function block(b,i){
    var y=b.y-camY;
    if(y>H||y+BH<0)return;
    ctx.fillStyle="hsl("+b.hue+",60%,55%)";
    ctx.fillRect(b.x,y,b.w,BH);
    ctx.fillStyle="rgba(255,255,255,.12)";
    ctx.fillRect(b.x,y,b.w,4);
  }
  function act(e){e.preventDefault();drop();}
  cv.addEventListener("pointerdown",act);
  window.addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();drop();}});
  reset();
})();
</script>
</body>
</html>
