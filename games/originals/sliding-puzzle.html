<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sliding Puzzle</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:12px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(400px,92vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:14px;color:#8a8f99;}
  .sc b{color:#f2b705;}
  #board{display:grid;gap:6px;width:min(400px,92vw);aspect-ratio:1;
    background:#15171c;border:1px solid #2a2c33;padding:6px;box-sizing:border-box;}
  .cell{background:#25272e;border:1px solid #35373f;display:grid;place-items:center;
    font-size:clamp(18px,7vw,34px);font-weight:700;cursor:pointer;color:#e8eaed;
    transition:background .1s,transform .08s;}
  .cell:hover{border-color:#f2b705;}
  .cell.blank{background:transparent;border-color:transparent;cursor:default;}
  .cell.done{color:#3fb950;}
  .row{display:flex;gap:8px;width:min(400px,92vw);}
  button{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button:hover{border-color:#f2b705;color:#f2b705;}
  .win{color:#3fb950;font-weight:700;min-height:16px;text-align:center;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;}
</style>
</head>
<body>
  <div class="top"><h1>Sliding Puzzle</h1><div class="sc">moves <b id="m">0</b> &middot; best <b id="b">—</b></div></div>
  <div id="board"></div>
  <div class="win" id="win"></div>
  <div class="row"><button id="new">Shuffle</button><button id="size">Size: 4×4</button></div>
  <div class="hint">Click or arrow-key a tile next to the gap. Order 1→N to win.</div>
<script>
(function(){
  "use strict";
  var N=4,board=[],blank,moves,solved=false;
  var bd=document.getElementById("board");
  function bestKey(){return "oslide.best"+N;}
  function showBest(){var b=localStorage.getItem(bestKey());document.getElementById("b").textContent=b||"—";}
  function solvable(a){
    var inv=0;for(var i=0;i<a.length;i++)for(var j=i+1;j<a.length;j++)
      if(a[i]&&a[j]&&a[i]>a[j])inv++;
    if(N%2){return inv%2===0;}
    var rowFromBottom=N-((a.indexOf(0)/N)|0);
    return (rowFromBottom%2===0)===(inv%2===1);
  }
  function shuffle(){
    do{ board=[];for(var i=0;i<N*N;i++)board.push(i);
      for(var k=board.length-1;k>0;k--){var r=(Math.random()*(k+1))|0;var t=board[k];board[k]=board[r];board[r]=t;}
    }while(!solvable(board)||isSolved());
    blank=board.indexOf(0);moves=0;solved=false;
    document.getElementById("m").textContent=0;document.getElementById("win").textContent="";
    render();
  }
  function isSolved(){for(var i=0;i<N*N-1;i++)if(board[i]!==i+1)return false;return true;}
  function render(){
    bd.style.gridTemplateColumns="repeat("+N+",1fr)";bd.innerHTML="";
    board.forEach(function(v,i){
      var c=document.createElement("div");c.className="cell"+(v===0?" blank":"");
      if(v!==0){c.textContent=v; if(solved||v===i+1)c.classList.add("done");
        c.addEventListener("click",function(){move(i);});}
      bd.appendChild(c);
    });
  }
  function move(i){
    if(solved)return;
    var br=(blank/N)|0,bc=blank%N,r=(i/N)|0,c=i%N;
    if(Math.abs(br-r)+Math.abs(bc-c)!==1)return;
    board[blank]=board[i];board[i]=0;blank=i;
    moves++;document.getElementById("m").textContent=moves;
    if(isSolved()){solved=true;win();}
    render();
  }
  function win(){
    document.getElementById("win").textContent="Solved in "+moves+" moves!";
    var prev=+(localStorage.getItem(bestKey())||1e9);
    if(moves<prev){localStorage.setItem(bestKey(),moves);showBest();}
  }
  // arrow keys move the tile that would slide into the gap
  document.addEventListener("keydown",function(e){
    var br=(blank/N)|0,bc=blank%N,target=-1;
    if(e.key==="ArrowUp"&&br<N-1)target=blank+N;
    else if(e.key==="ArrowDown"&&br>0)target=blank-N;
    else if(e.key==="ArrowLeft"&&bc<N-1)target=blank+1;
    else if(e.key==="ArrowRight"&&bc>0)target=blank-1;
    if(target>=0){e.preventDefault();move(target);}
  });
  document.getElementById("new").addEventListener("click",shuffle);
  document.getElementById("size").addEventListener("click",function(){
    N=N===4?3:N===3?5:4;this.textContent="Size: "+N+"×"+N;showBest();shuffle();
  });
  showBest();shuffle();
})();
</script>
</body>
</html>
