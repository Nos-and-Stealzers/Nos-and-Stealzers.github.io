<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Blaster</title>
<style>
  html,body{margin:0;height:100%;background:#05060a;color:#e8eaed;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:8px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .hud{display:flex;gap:18px;width:min(480px,96vw);font-size:14px;}
  .hud b{color:#4dd9ff;}
  canvas{background:linear-gradient(180deg,#070a14,#05060a);border:1px solid #1a2233;border-radius:10px;width:min(480px,96vw);height:auto;touch-action:none;}
  .hint{font-size:12px;color:#7a8290;}
</style>
</head>
<body>
  <div class="hud"><span>score <b id="score">0</b></span><span>wave <b id="wave">1</b></span><span style="margin-left:auto">lives <b id="lives">3</b></span></div>
  <canvas id="c" width="480" height="600"></canvas>
  <div class="hint">Move: mouse / arrows / drag · Fire: auto · P to pause</div>
<script>
(function(){
  "use strict";
  var c=document.getElementById("c"),x=c.getContext("2d"),W=480,H=600;
  var ship={x:W/2,y:H-50,w:30,h:22},bullets=[],foes=[],parts=[],stars=[];
  var score=0,wave=1,lives=3,tick=0,paused=false,over=false,spawnT=0;
  for(var i=0;i<60;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.3});
  var S=document.getElementById("score"),Wv=document.getElementById("wave"),L=document.getElementById("lives");
  function spawnFoe(){
    var kind=Math.random()<0.2+wave*0.02?1:0;
    foes.push({x:20+Math.random()*(W-40),y:-20,w:26,h:20,hp:kind?3:1,kind:kind,vy:0.7+wave*0.12+Math.random()*0.5,sway:Math.random()*2-1,t:0});
  }
  function boom(px,py,col){for(var i=0;i<10;i++)parts.push({x:px,y:py,vx:(Math.random()*2-1)*3,vy:(Math.random()*2-1)*3,life:20,col:col});}
  function step(){
    if(paused||over)return;
    tick++;
    if(tick%Math.max(6,10-wave)===0)bullets.push({x:ship.x,y:ship.y-14,vy:-8});
    spawnT++;
    if(spawnT>Math.max(22,60-wave*3)){spawnT=0;spawnFoe();}
    bullets=bullets.filter(function(b){b.y+=b.vy;return b.y>-10;});
    parts=parts.filter(function(p){p.x+=p.vx;p.y+=p.vy;p.life--;return p.life>0;});
    foes.forEach(function(f){f.t++;f.y+=f.vy;f.x+=Math.sin(f.t*0.05)*f.sway;});
    // collisions
    for(var i=foes.length-1;i>=0;i--){var f=foes[i];
      for(var j=bullets.length-1;j>=0;j--){var b=bullets[j];
        if(Math.abs(b.x-f.x)<f.w/2&&Math.abs(b.y-f.y)<f.h/2){bullets.splice(j,1);f.hp--;boom(b.x,b.y,"#4dd9ff");
          if(f.hp<=0){score+=f.kind?30:10;boom(f.x,f.y,f.kind?"#ff7043":"#e6b800");foes.splice(i,1);break;}}
      }
      if(f&&(f.y>H+20)){foes.splice(i,1);}
      else if(f&&Math.abs(f.x-ship.x)<(f.w+ship.w)/2&&Math.abs(f.y-ship.y)<(f.h+ship.h)/2){
        foes.splice(i,1);lives--;L.textContent=lives;boom(ship.x,ship.y,"#ff5252");
        if(lives<=0){over=true;}
      }
    }
    if(score>=wave*120){wave++;Wv.textContent=wave;}
    S.textContent=score;
  }
  function draw(){
    x.clearRect(0,0,W,H);
    x.fillStyle="#8fa";stars.forEach(function(s){s.y+=s.s;if(s.y>H)s.y=0;x.globalAlpha=s.s/2;x.fillRect(s.x,s.y,s.s,s.s);});x.globalAlpha=1;
    // ship
    x.fillStyle="#4dd9ff";x.beginPath();x.moveTo(ship.x,ship.y-ship.h/2);x.lineTo(ship.x-ship.w/2,ship.y+ship.h/2);x.lineTo(ship.x+ship.w/2,ship.y+ship.h/2);x.closePath();x.fill();
    x.fillStyle="#e6f7ff";bullets.forEach(function(b){x.fillRect(b.x-2,b.y-8,4,10);});
    foes.forEach(function(f){x.fillStyle=f.kind?"#ff7043":"#e05a4a";x.fillRect(f.x-f.w/2,f.y-f.h/2,f.w,f.h);
      x.fillStyle="#0c0d10";x.fillRect(f.x-6,f.y-2,4,4);x.fillRect(f.x+2,f.y-2,4,4);});
    parts.forEach(function(p){x.globalAlpha=p.life/20;x.fillStyle=p.col;x.fillRect(p.x,p.y,3,3);});x.globalAlpha=1;
    if(over){x.fillStyle="rgba(5,6,10,.8)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";
      x.font="28px monospace";x.fillText("GAME OVER",W/2,H/2-10);x.font="15px monospace";x.fillStyle="#4dd9ff";
      x.fillText("Score "+score+" — tap or press R",W/2,H/2+22);}
    if(paused&&!over){x.fillStyle="rgba(5,6,10,.6)";x.fillRect(0,0,W,H);x.fillStyle="#fff";x.textAlign="center";x.font="24px monospace";x.fillText("PAUSED",W/2,H/2);}
  }
  function loop(){step();draw();requestAnimationFrame(loop);}
  function reset(){score=0;wave=1;lives=3;foes=[];bullets=[];parts=[];over=false;paused=false;S.textContent=0;Wv.textContent=1;L.textContent=3;}
  function moveTo(cx){var r=c.getBoundingClientRect();ship.x=Math.max(ship.w/2,Math.min(W-ship.w/2,(cx-r.left)*(W/r.width)));}
  c.addEventListener("mousemove",function(e){moveTo(e.clientX);});
  c.addEventListener("touchmove",function(e){moveTo(e.touches[0].clientX);e.preventDefault();},{passive:false});
  c.addEventListener("click",function(){if(over)reset();});
  var keys={};
  document.addEventListener("keydown",function(e){keys[e.key.toLowerCase()]=1;
    if(e.key.toLowerCase()==="p")paused=!paused;if(e.key.toLowerCase()==="r"&&over)reset();});
  document.addEventListener("keyup",function(e){keys[e.key.toLowerCase()]=0;});
  setInterval(function(){if(keys["arrowleft"]||keys["a"])ship.x=Math.max(ship.w/2,ship.x-7);
    if(keys["arrowright"]||keys["d"])ship.x=Math.min(W-ship.w/2,ship.x+7);},16);
  reset();loop();
})();
</script>
</body>
</html>
