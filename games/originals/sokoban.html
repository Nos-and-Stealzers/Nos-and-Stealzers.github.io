<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Sokoban</title>
<style>
  html,body{margin:0;height:100%;background:#0c0d10;color:#e8eaed;
    font-family:ui-monospace,Menlo,Consolas,monospace;}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100dvh;gap:12px;padding:12px;user-select:none;-webkit-tap-highlight-color:transparent;}
  .top{display:flex;gap:16px;width:min(460px,94vw);align-items:baseline;}
  h1{font-size:24px;margin:0;letter-spacing:-1px;}
  .sc{margin-left:auto;font-size:14px;color:#8a8f99;}
  .sc b{color:#f2b705;}
  canvas{background:#15171c;border:1px solid #2a2c33;touch-action:none;image-rendering:pixelated;max-width:94vw;height:auto;}
  .row{display:flex;gap:8px;width:min(460px,94vw);}
  button{flex:1;background:#25272e;color:#e8eaed;border:1px solid #35373f;padding:10px;font:inherit;cursor:pointer;}
  button:hover{border-color:#f2b705;color:#f2b705;}
  .msg{min-height:16px;font-weight:700;color:#3fb950;}
  .hint{font-size:12px;color:#8a8f99;text-align:center;}
</style>
</head>
<body>
  <div class="top"><h1>Sokoban</h1><div class="sc">level <b id="lv">1</b> &middot; moves <b id="mv">0</b></div></div>
  <canvas id="c" width="440" height="440"></canvas>
  <div class="msg" id="msg"></div>
  <div class="row"><button id="undo">Undo</button><button id="restart">Restart</button><button id="skip">Skip &rarr;</button></div>
  <div class="hint">Push every crate onto a goal. Arrows / WASD to move &middot; swipe on touch &middot; Z to undo</div>
<script>
(function(){
  "use strict";
  // # wall, space floor, . goal, $ crate, * crate-on-goal, @ player, + player-on-goal
  var LEVELS=[
    ["######","#  . #","# $@ #","# .$ #","#  ###","######"],
    ["######","#    #","# .$ #","# @  #","# $. #","######"],
    ["########","#  .   #","# $$ @ #","# .. $ #","#   $  #","#  .   #","########"],
    ["#######","# ... #","# $$$ #","#  @  #","#######"],
    ["########","#      #","# .$.$ #","#  @   #","# $.$. #","########"],
    ["########","#      #","# .$.$ #","# $.$. #","#  @   #","########"]
  ];
  var cv=document.getElementById("c"),ctx=cv.getContext("2d");
  var grid,goals,px,py,rows,cols,cell,moves,level=0,history,solved;
  var best=JSON.parse(localStorage.getItem("osok.progress")||"0");
  if(best&&best<LEVELS.length)level=best;

  function parse(map){
    grid=[];goals=[];
    rows=map.length;cols=0;
    for(var y=0;y<rows;y++)cols=Math.max(cols,map[y].length);
    for(var y=0;y<rows;y++){
      var line=[];
      for(var x=0;x<cols;x++){
        var ch=map[y][x]||" ";
        if(ch==="#"){line.push("#");}
        else{
          if(ch==="."||ch==="*"||ch==="+")goals.push(y*cols+x);
          if(ch==="@"||ch==="+"){px=x;py=y;line.push(" ");}
          else if(ch==="$"||ch==="*"){line.push("$");}
          else line.push(" ");
        }
      }
      grid.push(line);
    }
  }
  function load(n){
    level=n;parse(LEVELS[n]);moves=0;history=[];solved=false;
    document.getElementById("msg").textContent="";
    document.getElementById("lv").textContent=(n+1);
    resize();draw();
  }
  function resize(){
    cell=Math.floor(Math.min(440/cols,440/rows));
    cv.width=cell*cols;cv.height=cell*rows;
  }
  function at(x,y){return grid[y][x];}
  function isGoal(x,y){return goals.indexOf(y*cols+x)!==-1;}
  function snapshot(){return JSON.stringify({g:grid,px:px,py:py,m:moves});}

  function move(dx,dy){
    if(solved)return;
    var nx=px+dx,ny=py+dy;
    if(ny<0||ny>=rows||nx<0||nx>=cols)return;
    var target=at(nx,ny);
    if(target==="#")return;
    if(target==="$"){
      var bx=nx+dx,by=ny+dy;
      if(by<0||by>=rows||bx<0||bx>=cols)return;
      var beyond=at(bx,by);
      if(beyond==="#"||beyond==="$")return;
      history.push(snapshot());
      grid[ny][nx]=" ";grid[by][bx]="$";
      px=nx;py=ny;moves++;
    } else {
      history.push(snapshot());
      px=nx;py=ny;moves++;
    }
    if(history.length>500)history.shift();
    draw();checkWin();
  }
  function checkWin(){
    var done=goals.every(function(idx){var y=(idx/cols)|0,x=idx%cols;return grid[y][x]==="$";});
    if(done){
      solved=true;
      document.getElementById("msg").textContent="Solved in "+moves+" moves!";
      var next=Math.max(best,Math.min(level+1,LEVELS.length));
      localStorage.setItem("osok.progress",JSON.stringify(next));best=next;
      setTimeout(function(){if(level+1<LEVELS.length)load(level+1);else document.getElementById("msg").textContent="All levels complete! \u2605";},900);
    }
  }
  function draw(){
    ctx.fillStyle="#15171c";ctx.fillRect(0,0,cv.width,cv.height);
    for(var y=0;y<rows;y++)for(var x=0;x<cols;x++){
      var c=at(x,y),ox=x*cell,oy=y*cell;
      if(c==="#"){ctx.fillStyle="#3a3f4b";ctx.fillRect(ox,oy,cell,cell);
        ctx.fillStyle="#2b2f38";ctx.fillRect(ox+2,oy+2,cell-4,cell-4);continue;}
      // floor
      ctx.fillStyle="#1b1d22";ctx.fillRect(ox,oy,cell,cell);
      if(isGoal(x,y)){ctx.strokeStyle="#f2b705";ctx.lineWidth=2;
        ctx.strokeRect(ox+cell*0.32,oy+cell*0.32,cell*0.36,cell*0.36);}
      if(c==="$"){
        var onGoal=isGoal(x,y);
        ctx.fillStyle=onGoal?"#3fb950":"#b06a2e";
        ctx.fillRect(ox+3,oy+3,cell-6,cell-6);
        ctx.strokeStyle=onGoal?"#2a8a3c":"#8a4e20";ctx.lineWidth=2;
        ctx.strokeRect(ox+3,oy+3,cell-6,cell-6);
        ctx.beginPath();ctx.moveTo(ox+3,oy+3);ctx.lineTo(ox+cell-3,oy+cell-3);
        ctx.moveTo(ox+cell-3,oy+3);ctx.lineTo(ox+3,oy+cell-3);ctx.stroke();
      }
    }
    // player
    var pox=px*cell,poy=py*cell;
    ctx.fillStyle="#4dd9ff";
    ctx.beginPath();ctx.arc(pox+cell/2,poy+cell/2,cell*0.32,0,Math.PI*2);ctx.fill();
    document.getElementById("mv").textContent=moves;
  }
  function undo(){if(history.length){var s=JSON.parse(history.pop());grid=s.g;px=s.px;py=s.py;moves=s.m;solved=false;document.getElementById("msg").textContent="";draw();}}

  document.addEventListener("keydown",function(e){
    var k=e.key.toLowerCase();
    if(k==="arrowup"||k==="w"){move(0,-1);e.preventDefault();}
    else if(k==="arrowdown"||k==="s"){move(0,1);e.preventDefault();}
    else if(k==="arrowleft"||k==="a"){move(-1,0);e.preventDefault();}
    else if(k==="arrowright"||k==="d"){move(1,0);e.preventDefault();}
    else if(k==="z"){undo();e.preventDefault();}
  });
  var sx,sy;
  cv.addEventListener("touchstart",function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;e.preventDefault();},{passive:false});
  cv.addEventListener("touchend",function(e){
    if(sx==null)return;var t=e.changedTouches[0];var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<18)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0);else move(0,dy>0?1:-1);
    sx=sy=null;
  },{passive:true});
  document.getElementById("undo").onclick=undo;
  document.getElementById("restart").onclick=function(){load(level);};
  document.getElementById("skip").onclick=function(){if(level+1<LEVELS.length)load(level+1);};
  window.addEventListener("resize",function(){resize();draw();});
  load(level);
})();
</script>
</body>
</html>
